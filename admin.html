<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Admin — IMPERSILVA</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#0e0e0f;--dark:#161618;--charcoal:#242428;--charcoal-lt:#2e2e33;
  --red:#d62828;--red-lt:#e84040;--red-dim:rgba(214,40,40,.12);
  --blue:#1d4ed8;--blue-lt:#3b6ef0;--blue-dim:rgba(29,78,216,.12);
  --green:#22c55e;--green-dim:rgba(34,197,94,.12);
  --white:#fff;--gray:#888896;--gray-lt:#c0c0cc;--divider:rgba(255,255,255,.07);
  --top:52px;--bot:60px;
}
html,body{height:100%}
body{font-family:'Barlow',sans-serif;background:var(--dark);color:var(--white);-webkit-text-size-adjust:100%}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--black);padding:1.5rem;background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:60px 60px}
.lbox{background:var(--charcoal);border:1px solid var(--divider);border-radius:16px;padding:2rem 1.5rem;width:100%;max-width:340px;text-align:center}
.llogo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:2.2rem;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.llogo .r{color:var(--red)}.llogo .b{color:var(--blue-lt)}
.lsub{font-size:.58rem;letter-spacing:.25em;color:var(--gray);text-transform:uppercase;margin:.2rem 0 1.8rem}
.linput{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:1rem;color:var(--white);font-family:'Barlow',sans-serif;font-size:1rem;outline:none;margin-bottom:1rem;transition:border-color .2s;-webkit-appearance:none}
.linput:focus{border-color:var(--red)}
.lbtn{width:100%;background:var(--red);color:#fff;border:none;border-radius:8px;padding:1rem;font-family:'Barlow',sans-serif;font-size:.9rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.lbtn:active{background:var(--red-lt)}
.lerr{color:var(--red);font-size:.78rem;margin-top:.6rem;display:none}
#app{display:none;flex-direction:column;min-height:100vh}
#topbar{position:fixed;top:0;left:0;right:0;height:var(--top);background:var(--black);border-bottom:1px solid var(--divider);display:flex;align-items:center;justify-content:space-between;padding:0 1rem;z-index:200}
.tlogo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.3rem;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;color:var(--white);line-height:1}
.tlogo .r{color:var(--red)}.tlogo .b{color:var(--blue-lt)}
.tlogo-sub{font-size:.42rem;letter-spacing:.2em;color:var(--gray);text-transform:uppercase;display:block}
.tbadge{font-size:.52rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--red-dim);color:var(--red);border:1px solid rgba(214,40,40,.3);padding:.2rem .45rem;border-radius:4px}
.tlogout{background:none;border:none;color:var(--gray);font-size:1rem;cursor:pointer;padding:.3rem .5rem}
#main{margin-top:var(--top);padding-bottom:calc(var(--bot) + .5rem);min-height:calc(100vh - var(--top))}
#mc{padding:1rem}
.ph{padding:.8rem 0 1.2rem;border-bottom:1px solid var(--divider);margin-bottom:1.2rem}
.pt{font-family:'Barlow Condensed',sans-serif;font-size:1.5rem;font-weight:900;text-transform:uppercase;letter-spacing:.03em}
.pt .r{color:var(--red)}.pt .b{color:var(--blue-lt)}
.ps{font-size:.78rem;color:var(--gray);font-weight:300;margin-top:.2rem}
#bnav{position:fixed;bottom:0;left:0;right:0;height:var(--bot);background:var(--black);border-top:1px solid var(--divider);display:flex;align-items:stretch;z-index:200}
.bni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border:none;background:none;color:var(--gray);font-family:'Barlow',sans-serif;font-size:.48rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;transition:color .15s;padding:.2rem;border-top:2px solid transparent;-webkit-tap-highlight-color:transparent}
.bni.active{color:var(--white);border-top-color:var(--red)}
.bni i{font-size:1.1rem}
#moreOv{display:none;position:fixed;inset:0;z-index:198;background:rgba(0,0,0,.45)}
#moreOv.open{display:block}
#moreM{position:fixed;bottom:var(--bot);left:0;right:0;background:var(--black);border-top:1px solid var(--divider);z-index:199;transform:translateY(100%);transition:transform .25s ease;border-radius:16px 16px 0 0;padding:1rem 1rem .5rem}
#moreM.open{transform:translateY(0)}
.mh{width:36px;height:3px;background:rgba(255,255,255,.2);border-radius:2px;margin:0 auto .8rem}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}
.mi{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem;padding:.7rem .3rem;border-radius:10px;cursor:pointer;background:rgba(255,255,255,.04);border:1px solid var(--divider);color:var(--gray);font-size:.52rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;text-align:center;transition:all .15s;-webkit-tap-highlight-color:transparent}
.mi:active,.mi.active{background:var(--red-dim);color:var(--white);border-color:rgba(214,40,40,.3)}
.mi i{font-size:1.2rem}
#sidebar{display:none;position:fixed;left:0;top:0;bottom:0;width:220px;flex-direction:column;background:var(--black);border-right:1px solid var(--divider);z-index:100;overflow-y:auto}
.sbl{padding:1.2rem 1rem .8rem;border-bottom:1px solid var(--divider)}
.sblt{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.3rem;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;color:var(--white)}
.sblt .r{color:var(--red)}.sblt .b{color:var(--blue-lt)}
.sbls{font-size:.47rem;letter-spacing:.22em;color:var(--gray);text-transform:uppercase}
.sbb{font-size:.52rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--red-dim);color:var(--red);border:1px solid rgba(214,40,40,.25);padding:.15rem .4rem;border-radius:3px;margin-top:.4rem;display:inline-block}
.sbn{flex:1;padding:.5rem 0}
.sbsec{font-size:.54rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.2);padding:.7rem 1rem .3rem}
.sbi{display:flex;align-items:center;gap:.6rem;padding:.65rem 1rem;font-size:.8rem;font-weight:500;color:var(--gray);cursor:pointer;border-left:2px solid transparent;transition:all .18s;text-decoration:none}
.sbi:hover{color:var(--white);background:rgba(255,255,255,.03)}
.sbi.active{color:var(--white);border-left-color:var(--red);background:var(--red-dim)}
.sbi .ic{font-size:.9rem;width:18px;text-align:center}
.sbf{padding:.8rem 1rem;border-top:1px solid var(--divider)}
.sbu{font-size:.7rem;color:var(--gray);margin-bottom:.4rem}
.sblo{font-size:.7rem;color:var(--red);cursor:pointer;background:none;border:none;font-family:'Barlow',sans-serif;padding:0}
.card{background:var(--charcoal);border:1px solid var(--divider);border-radius:12px;padding:1rem;margin-bottom:1rem}
.ct{font-size:.63rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gray);margin-bottom:.9rem;padding-bottom:.55rem;border-bottom:1px solid var(--divider);display:flex;align-items:center;gap:.5rem}
.sr{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-bottom:1rem}
.sc{background:rgba(255,255,255,.03);border:1px solid var(--divider);border-radius:10px;padding:.9rem;text-align:center}
.sn{font-family:'Barlow Condensed',sans-serif;font-size:1.9rem;font-weight:900;color:var(--white);line-height:1}
.sl{font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gray);margin-top:.25rem}
.fg{margin-bottom:.85rem}
.fl{display:block;font-size:.63rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gray-lt);margin-bottom:.35rem}
.fi{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:.85rem 1rem;color:var(--white);font-family:'Barlow',sans-serif;font-size:.95rem;font-weight:300;outline:none;transition:border-color .2s;-webkit-appearance:none}
.fi:focus{border-color:var(--red)}
.fi::placeholder{color:rgba(255,255,255,.2)}
.fi option{background:var(--charcoal);color:var(--white)}
textarea.fi{resize:vertical;min-height:85px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font-family:'Barlow',sans-serif;font-size:.82rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.75rem 1.1rem;border:none;border-radius:8px;cursor:pointer;transition:all .15s;text-decoration:none;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.bfull{width:100%}
.bred{background:var(--red);color:#fff}.bred:active{background:var(--red-lt)}
.bblue{background:var(--blue);color:#fff}.bblue:active{background:var(--blue-lt)}
.bgrn{background:var(--green);color:#fff}.bgrn:active{opacity:.9}
.bgh{background:rgba(255,255,255,.05);color:var(--gray-lt);border:1px solid rgba(255,255,255,.1)}.bgh:active{border-color:var(--white);color:var(--white)}
.bdng{background:rgba(214,40,40,.12);color:var(--red);border:1px solid rgba(214,40,40,.25)}.bdng:active{background:var(--red);color:#fff}
.bsm{padding:.5rem .9rem;font-size:.72rem}
.brow{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}
.li{background:rgba(255,255,255,.03);border:1px solid var(--divider);border-radius:10px;padding:.9rem;margin-bottom:.65rem;display:flex;align-items:flex-start;gap:.75rem}
.lin{font-family:'Barlow Condensed',sans-serif;font-size:.95rem;font-weight:900;color:var(--gray);min-width:20px;padding-top:1px}
.lib{flex:1;min-width:0}
.liname{font-family:'Barlow Condensed',sans-serif;font-size:.92rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--white);margin-bottom:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lidesc{font-size:.73rem;color:var(--gray);font-weight:300;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.limeta{display:flex;gap:.4rem;margin-top:.35rem;flex-wrap:wrap;align-items:center}
.liact{display:flex;flex-direction:column;gap:.35rem;flex-shrink:0}
.cc{background:rgba(255,255,255,.03);border:1px solid var(--divider);border-radius:10px;padding:.9rem;margin-bottom:.65rem}
.cctop{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:.4rem}
.ccid{font-family:monospace;font-size:.88rem;font-weight:700;letter-spacing:.12em;color:var(--white);background:rgba(255,255,255,.07);padding:.2rem .55rem;border-radius:4px;cursor:pointer}
.ccname{font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--white);margin-bottom:.15rem}
.ccurl{font-size:.7rem;color:var(--blue-lt);word-break:break-all;margin-bottom:.4rem}
.ccmeta{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center}
.ccact{display:flex;gap:.45rem;margin-top:.65rem}
.badge{display:inline-flex;align-items:center;gap:.25rem;font-size:.54rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:.2rem .45rem;border-radius:50px}
.bg{background:rgba(34,197,94,.1);color:var(--green);border:1px solid rgba(34,197,94,.3)}
.bb{background:var(--blue-dim);color:var(--blue-lt);border:1px solid rgba(29,78,216,.3)}
.br{background:var(--red-dim);color:var(--red);border:1px solid rgba(214,40,40,.3)}
.bgr{background:rgba(255,255,255,.05);color:var(--gray);border:1px solid rgba(255,255,255,.1)}
.dlive{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;display:inline-block}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
#modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:999;display:none;align-items:flex-end;justify-content:center}
#modalOverlay.open{display:flex}
.modal{background:var(--charcoal);border:1px solid var(--divider);border-radius:16px 16px 0 0;padding:1.2rem 1.2rem 2rem;width:100%;max-height:90vh;overflow-y:auto;position:relative}
.mhdl{width:36px;height:3px;background:rgba(255,255,255,.2);border-radius:2px;margin:0 auto .8rem}
.mtitle{font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;font-weight:800;text-transform:uppercase;margin-bottom:1.1rem}
.mtitle .r{color:var(--red)}.mtitle .b{color:var(--blue-lt)}
.mclose{position:absolute;top:1rem;right:1rem;background:none;border:none;color:var(--gray);font-size:1.2rem;cursor:pointer;line-height:1;padding:.3rem}
.mact{display:flex;gap:.7rem;margin-top:1.1rem}
.mact .btn{flex:1}
#toast{position:fixed;top:calc(var(--top) + .7rem);left:1rem;right:1rem;z-index:9999;background:var(--charcoal);border:1px solid var(--divider);border-radius:10px;padding:.8rem 1rem;display:flex;align-items:center;gap:.7rem;opacity:0;transform:translateY(-6px);transition:all .25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateY(0)}
#toast.success{border-color:rgba(34,197,94,.4)}
#toast.error{border-color:rgba(214,40,40,.4)}
#toast.info{border-color:rgba(29,78,216,.4)}
.tdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.tdot.g{background:var(--green)}.tdot.r{background:var(--red)}.tdot.b{background:var(--blue-lt)}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--gray)}
.empty i{font-size:2.5rem;opacity:.3;margin-bottom:.8rem;display:block}
.empty p{font-size:.85rem;font-weight:300}
.spin{width:18px;height:18px;border:2px solid var(--divider);border-top-color:var(--red);border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.load{display:flex;align-items:center;justify-content:center;gap:.6rem;padding:2rem;color:var(--gray);font-size:.85rem}
.pg{background:var(--divider);border-radius:4px;height:5px;overflow:hidden;margin:.5rem 0}
.pgf{height:100%;background:linear-gradient(to right,var(--red),var(--blue-lt));transition:width .3s;border-radius:4px}
.isgrid{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}
.islot{background:rgba(255,255,255,.03);border:1.5px dashed rgba(255,255,255,.12);border-radius:10px;padding:.85rem .6rem;cursor:pointer;text-align:center;transition:all .2s;-webkit-tap-highlight-color:transparent}
.islot:active{background:var(--red-dim);border-color:rgba(214,40,40,.4)}
.islot.done{border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.05)}
.islot i{font-size:1.3rem;color:rgba(255,255,255,.22);margin-bottom:.35rem;display:block}
.islab{font-size:.68rem;font-weight:600;color:var(--white);margin-bottom:.12rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.isfile{font-size:.56rem;color:var(--gray);font-family:monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:700px){
  :root{--sidebar:220px}
  #topbar{display:none}
  #bnav,#moreM,#moreOv{display:none !important}
  #sidebar{display:flex !important}
  #main{margin-top:0;margin-left:220px;padding-bottom:1.5rem}
  #mc{padding:1.5rem}
  .sr{grid-template-columns:repeat(3,1fr)}
  #modalOverlay{align-items:center}
  .modal{border-radius:14px;max-width:500px;margin:auto}
  .isgrid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="lbox">
    <div class="llogo">IMPERSIL<span class="r">V</span><span class="b">Λ</span></div>
    <div class="lsub">Admin · IMPERSILVA</div>
    <input class="linput" type="password" id="loginPass" placeholder="Password" autocomplete="current-password">
    <button class="lbtn" onclick="doLogin()"><i class="fa-solid fa-lock-open"></i> Entrar</button>
    <div class="lerr" id="loginErr">Password incorrecta.</div>
  </div>
</div>

<div id="app">
  <aside id="sidebar">
    <div class="sbl">
      <div class="sblt">IMPERSIL<span class="r">V</span><span class="b">Λ</span></div>
      <div class="sbls">Holding SGPS</div>
      <div class="sbb">Admin</div>
    </div>
    <nav class="sbn">
      <div class="sbsec">Geral</div>
      <div class="sbi active" data-s="painel" onclick="nav(this,'painel')"><span class="ic"><i class="fa-solid fa-gauge"></i></span> Painel</div>
      <div class="sbi" data-s="github" onclick="nav(this,'github')"><span class="ic"><i class="fa-brands fa-github"></i></span> GitHub</div>
      <div class="sbsec">Conteúdo</div>
      <div class="sbi" data-s="contactos" onclick="nav(this,'contactos')"><span class="ic"><i class="fa-solid fa-phone"></i></span> Contactos</div>
      <div class="sbi" data-s="portfolio" onclick="nav(this,'portfolio')"><span class="ic"><i class="fa-solid fa-briefcase"></i></span> Portfólio</div>
      <div class="sbi" data-s="depoimentos" onclick="nav(this,'depoimentos')"><span class="ic"><i class="fa-solid fa-quote-left"></i></span> Depoimentos</div>
      <div class="sbi" data-s="imagens" onclick="nav(this,'imagens')"><span class="ic"><i class="fa-solid fa-image"></i></span> Imagens</div>
      <div class="sbi" data-s="sobre" onclick="nav(this,'sobre')"><span class="ic"><i class="fa-solid fa-pen-to-square"></i></span> Sobre Nós</div>
      <div class="sbsec">Clientes</div>
      <div class="sbi" data-s="clientes" onclick="nav(this,'clientes')"><span class="ic"><i class="fa-solid fa-globe"></i></span> Sites de Clientes</div>
    </nav>
    <div class="sbf">
      <div class="sbu">Administrador</div>
      <button class="sblo" onclick="doLogout()">Terminar sessão</button>
    </div>
  </aside>

  <div id="topbar">
    <div>
      <div class="tlogo">IMPERSIL<span class="r">V</span><span class="b">Λ</span><span class="tlogo-sub">Holding SGPS</span></div>
    </div>
    <div style="display:flex;align-items:center;gap:.7rem">
      <span class="tbadge">Admin</span>
      <button class="tlogout" onclick="doLogout()"><i class="fa-solid fa-right-from-bracket"></i></button>
    </div>
  </div>

  <div id="main"><div id="mc"></div></div>

  <nav id="bnav">
    <button class="bni active" data-s="painel" onclick="navB(this,'painel')"><i class="fa-solid fa-gauge"></i><span>Painel</span></button>
    <button class="bni" data-s="clientes" onclick="navB(this,'clientes')"><i class="fa-solid fa-globe"></i><span>Clientes</span></button>
    <button class="bni" data-s="portfolio" onclick="navB(this,'portfolio')"><i class="fa-solid fa-briefcase"></i><span>Portfólio</span></button>
    <button class="bni" data-s="imagens" onclick="navB(this,'imagens')"><i class="fa-solid fa-image"></i><span>Imagens</span></button>
    <button class="bni" onclick="toggleMore()"><i class="fa-solid fa-ellipsis"></i><span>Mais</span></button>
  </nav>

  <div id="moreOv" onclick="closeMore()"></div>
  <div id="moreM">
    <div class="mh"></div>
    <div class="mg">
      <div class="mi" onclick="navMore('github')"><i class="fa-brands fa-github"></i>GitHub</div>
      <div class="mi" onclick="navMore('contactos')"><i class="fa-solid fa-phone"></i>Contactos</div>
      <div class="mi" onclick="navMore('depoimentos')"><i class="fa-solid fa-quote-left"></i>Depoimentos</div>
      <div class="mi" onclick="navMore('sobre')"><i class="fa-solid fa-pen-to-square"></i>Sobre Nós</div>
    </div>
  </div>
</div>

<div id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBox"></div>
</div>
<div id="toast"><div class="tdot" id="toastDot"></div><span id="toastMsg"></span></div>

<script>
const ADMIN_PASS = 'impersilva@2026';
let GH_CFG = JSON.parse(localStorage.getItem('gh_cfg')||'{}');
let _toastTimer;

function doLogin(){
  const p = document.getElementById('loginPass').value;
  if(p===ADMIN_PASS){
    localStorage.setItem('adm_session','1');
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('app').style.display='flex';
    if(window.innerWidth>=700) document.getElementById('sidebar').style.display='flex';
    render('painel');
  } else {
    document.getElementById('loginErr').style.display='block';
    document.getElementById('loginPass').value='';
  }
}
document.getElementById('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
if(localStorage.getItem('adm_session')){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='flex';
  if(window.innerWidth>=700) document.getElementById('sidebar').style.display='flex';
  render('painel');
}
function doLogout(){localStorage.removeItem('adm_session');location.reload();}

function nav(el,s){
  document.querySelectorAll('.sbi').forEach(i=>i.classList.remove('active'));
  el.classList.add('active');
  render(s);
}
function navB(el,s){
  document.querySelectorAll('.bni').forEach(i=>i.classList.remove('active'));
  el.classList.add('active');
  render(s);
}
function navMore(s){

function ghH(){return{'Authorization':'token '+GH_CFG.token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'};}
function b64e(s){return btoa(unescape(encodeURIComponent(s)));}
function b64d(s){return decodeURIComponent(escape(atob(s.replace(/\n/g,''))));}
async function ghGet(path){
  const r=await fetch(`https://api.github.com/repos/${GH_CFG.owner}/${GH_CFG.repo}/contents/${path}?ref=${GH_CFG.branch||'main'}`,{headers:ghH()});
  if(!r.ok){const e=await r.json();throw new Error(e.message||'GET failed');}
  const d=await r.json();return{content:b64d(d.content),sha:d.sha};
}
async function ghPut(path,content,sha,msg){
  const body={message:msg,content:b64e(content),branch:GH_CFG.branch||'main'};
  if(sha)body.sha=sha;
  const r=await fetch(`https://api.github.com/repos/${GH_CFG.owner}/${GH_CFG.repo}/contents/${path}`,{method:'PUT',headers:ghH(),body:JSON.stringify(body)});
  if(!r.ok){const e=await r.json();throw new Error(e.message||'PUT failed');}
  return r.json();
}
function ghOk(){return GH_CFG.token&&GH_CFG.owner&&GH_CFG.repo;}

function toast(msg,type='success'){
  const el=document.getElementById('toast'),dot=document.getElementById('toastDot');
  document.getElementById('toastMsg').textContent=msg;
  dot.className='tdot '+(type==='success'?'g':type==='error'?'r':'b');
  el.className='show '+type;
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>{el.className=type;},3500);
}

async function saveContacts(){
  if(!ghOk())return toast('Configure o GitHub','error');
  const phone=document.getElementById('ctPhone').value.trim(),wpp=document.getElementById('ctWpp').value.trim(),loc=document.getElementById('ctLoc').value.trim();

  document.getElementById('ctProg').style.display='block';

      ${cList.length?'<button class="btn bgrn" onclick="saveC()"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>':''}
      <a class="btn bgh bsm" href="verificar-site.html" target="_blank"><i class="fa-solid fa-arrow-up-right-from-square"></i> Portal</a>
    </div>
    <div id="cList">${cList.length?cList.map((c,i)=>`<div class="cc"><div class="cctop"><span class="ccid" onclick="copyId('${c.id}')">${c.id}</span><span class="badge ${c.activo?'bg':'bgr'}">${c.activo?'Activo':'Inactivo'}</span></div><div class="ccname">${c.nome}</div><div class="ccurl">${c.url}</div><div class="ccmeta"><span class="badge bb">${c.tipo||'Site'}</span><span style="font-size:.63rem;color:var(--gray)">${c.criado||''}</span></div><div class="ccact"><button class="btn bgh bsm" style="flex:1" onclick="editC(${i})"><i class="fa-solid fa-pen"></i> Editar</button><button class="btn bgh bsm" style="flex:1;color:var(--blue-lt)" onclick="shareC(${i})"><i class="fa-solid fa-share-nodes"></i> Partilhar</button><button class="btn bdng bsm" onclick="delC(${i})"><i class="fa-solid fa-trash"></i></button></div></div>`).join(''):'<div class="empty"><i class="fa-solid fa-globe"></i><p>Clique em Carregar</p></div>'}</div>`;
}
async function loadC(){
  if(!ghOk())return toast('Configure o GitHub','error');
  document.getElementById('cList').innerHTML='<div class="load"><div class="spin"></div> A carregar...</div>';
  try{const{content,sha}=await ghGet('data/clients.json');cSha=sha;cList=JSON.parse(content);toast(cList.length+' clientes','success');}
  catch(e){if(e.message.includes('404')||e.message.includes('Not Found')){cList=[];cSha=null;toast('Ficheiro não existe ainda','info');}else toast('Erro: '+e.message,'error');}
  rClientes();
}
async function saveC(){
  if(!ghOk())return toast('Configure o GitHub','error');
  try{await ghPut('data/clients.json',JSON.stringify(cList,null,2),cSha,'Admin: clientes');cSha=null;toast('Guardado!','success');await loadC();}
  catch(e){toast('Erro: '+e.message,'error');}
}
function openAddC(){const id=genId();openModal(`<button class="mclose" onclick="closeModal()">&#10005;</button><div class="mtitle">Novo <span class="r">Cliente</span></div><div class="fg"><label class="fl">ID</label><div style="display:flex;gap:.5rem"><input class="fi" id="clId" value="${id}" style="font-family:monospace;letter-spacing:.1em;flex:1"><button class="btn bgh bsm" onclick="document.getElementById('clId').value=genId()"><i class="fa-solid fa-arrows-rotate"></i></button></div><div style="font-size:.67rem;color:var(--gray);margin-top:.3rem">Código que o cliente usa no portal</div></div><div class="fg"><label class="fl">Nome / Empresa</label><input class="fi" id="clN" placeholder="ex: Belle Cosméticos"></div><div class="fg"><label class="fl">Tipo</label><select class="fi" id="clTp"><option>Site de Vendas</option><option>Loja Online</option><option>Site Institucional</option><option>Site Pessoal</option><option>Redes Sociais</option><option>Pacote Completo</option><option>Outro</option></select></div><div class="fg"><label class="fl">URL do Site</label><input class="fi" id="clU" placeholder="https://impersilvatech.github.io/..."></div><div class="fg"><label class="fl">Data</label><input class="fi" type="date" id="clDt" value="${new Date().toISOString().split('T')[0]}"></div><div class="fg"><label class="fl">Estado</label><select class="fi" id="clAc"><option value="true">Activo</option><option value="false">Inactivo</option></select></div><div class="mact"><button class="btn bgh" onclick="closeModal()">Cancelar</button><button class="btn bred" onclick="addC()">Adicionar</button></div>`);}
function addC(){const id=document.getElementById('clId').value.trim().toUpperCase(),n=document.getElementById('clN').value.trim(),u=document.getElementById('clU').value.trim();if(!id||!n||!u)return toast('Preencha ID, nome e URL','error');if(cList.find(c=>c.id===id))return toast('ID já existe!','error');cList.push({id,nome:n,url:u,tipo:document.getElementById('clTp').value,criado:document.getElementById('clDt').value,activo:document.getElementById('clAc').value==='true'});closeModal();rClientes();toast('Adicionado — guarde','info');}
function editC(i){const c=cList[i];openModal(`<button class="mclose" onclick="closeModal()">&#10005;</button><div class="mtitle">Editar <span class="r">Cliente</span></div><div class="fg"><label class="fl">ID</label><input class="fi" id="clId" value="${c.id}" style="font-family:monospace;letter-spacing:.1em"></div><div class="fg"><label class="fl">Nome</label><input class="fi" id="clN" value="${c.nome}"></div><div class="fg"><label class="fl">Tipo</label><select class="fi" id="clTp">${['Site de Vendas','Loja Online','Site Institucional','Site Pessoal','Redes Sociais','Pacote Completo','Outro'].map(t=>`<option ${c.tipo===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="fg"><label class="fl">URL</label><input class="fi" id="clU" value="${c.url}"></div><div class="fg"><label class="fl">Data</label><input class="fi" type="date" id="clDt" value="${c.criado||''}"></div><div class="fg"><label class="fl">Estado</label><select class="fi" id="clAc"><option value="true" ${c.activo?'selected':''}>Activo</option><option value="false" ${!c.activo?'selected':''}>Inactivo</option></select></div><div class="mact"><button class="btn bgh" onclick="closeModal()">Cancelar</button><button class="btn bred" onclick="updC(${i})">Guardar</button></div>`);}
function updC(i){cList[i]={id:document.getElementById('clId').value.trim().toUpperCase(),nome:document.getElementById('clN').value.trim(),tipo:document.getElementById('clTp').value,url:document.getElementById('clU').value.trim(),criado:document.getElementById('clDt').value,activo:document.getElementById('clAc').value==='true'};closeModal();rClientes();toast('Actualizado — guarde','info');}
function delC(i){if(!confirm('Remover "'+cList[i].nome+'"?'))return;cList.splice(i,1);rClientes();toast('Removido — guarde','info');}
function copyId(id){navigator.clipboard.writeText(id).then(()=>toast('ID '+id+' copiado!','success'));}
function shareC(i){
  const c=cList[i],link=location.origin+location.pathname.replace('admin.html','verificar-site.html')+'?id='+c.id;
  openModal(`<button class="mclose" onclick="closeModal()">&#10005;</button><div class="mtitle">Partilhar <span class="r">${c.nome}</span></div><div class="fg"><label class="fl">ID do Cliente</label><div style="display:flex;gap:.5rem"><input class="fi" value="${c.id}" readonly style="font-family:monospace;letter-spacing:.15em;font-size:1.1rem;flex:1"><button class="btn bred bsm" onclick="copyId('${c.id}')"><i class="fa-solid fa-copy"></i></button></div></div><div class="fg"><label class="fl">Link Directo</label><div style="display:flex;gap:.5rem"><input class="fi" value="${link}" readonly style="font-size:.7rem;flex:1"><button class="btn bblue bsm" onclick="navigator.clipboard.writeText('${link}').then(()=>toast('Copiado!','success'))"><i class="fa-solid fa-copy"></i></button></div></div><div style="background:var(--green-dim);border:1px solid rgba(34,197,94,.2);border-radius:8px;padding:.75rem;font-size:.73rem;color:rgba(255,255,255,.55)">O cliente vai a verificar-site.html, insere o ID e vê o site.</div><div class="mact"><button class="btn bgh" onclick="closeModal()">Fechar</button><a class="btn bblue" href="${link}" target="_blank"><i class="fa-solid fa-arrow-up-right-from-square"></i> Pré-ver</a></div>`);
}

// ─── IMAGENS ───
const SLOTS=[
  {file:'equipa-ceo.jpg',label:'Foto CEO',page:'sobre.html'},
  {file:'equipa-tech.jpg',label:'Equipa Tech',page:'sobre.html'},
  {file:'equipa-consultoria.jpg',label:'Consultores',page:'sobre.html'},
  {file:'icon-whatsapp.png',label:'Ícone WhatsApp',page:'contacto.html'},
  {file:'icon-telefone.png',label:'Ícone Telefone',page:'contacto.html'},
  {file:'icon-localizacao.png',label:'Ícone Localização',page:'contacto.html'},
  {file:'icon-remoto.png',label:'Ícone Remoto',page:'contacto.html'},
  {file:'site-moda.jpg',label:'Loja de Moda',page:'tech.html'},
  {file:'site-restaurante.jpg',label:'Restaurante',page:'tech.html'},
  {file:'site-salao.jpg',label:'Salão',page:'tech.html'},
  {file:'site-celulares.jpg',label:'Celulares',page:'tech.html'},
  {file:'site-cosmeticos.jpg',label:'Cosméticos',page:'tech.html'},
  {file:'site-perucas.jpg',label:'Perucas',page:'tech.html'},
  {file:'site-fastfood.jpg',label:'Fast Food',page:'tech.html'},
  {file:'site-empresa.jpg',label:'Empresa',page:'tech.html'},
  {file:'site-escola.jpg',label:'Formação',page:'tech.html'},
  {file:'site-extra.jpg',label:'Escritório',page:'tech.html'},
];
const PL={'sobre.html':'Sobre Nós','contacto.html':'Contacto','tech.html':'Portfólio'};
let _slot=null,_sb64=null;
function rImagens(){
  const grp={};SLOTS.forEach(s=>{if(!grp[s.page])grp[s.page]=[];grp[s.page].push(s);});
  let html=`<div class="ph"><div class="pt"><span class="r">Upload</span> de <span class="b">Imagens</span></div><div class="ps">Clique num slot para adicionar a imagem</div></div>`;
  if(!ghOk())html+=`<div class="card" style="border-color:rgba(214,40,40,.3)"><p style="color:var(--gray);font-size:.85rem"><i class="fa-solid fa-triangle-exclamation" style="color:var(--red)"></i> Configure o GitHub primeiro.</p></div>`;
  Object.keys(grp).forEach(page=>{
    html+=`<div class="card"><div class="ct"><i class="fa-solid fa-file-code"></i> ${PL[page]||page}</div><div class="isgrid">`;
    grp[page].forEach(s=>{html+=`<div class="islot" id="sl_${s.file.replace(/[^a-z0-9]/gi,'_')}" onclick="openSlot('${s.file}','${s.label}')"><i class="fa-solid fa-image"></i><div class="islab">${s.label}</div><div class="isfile">${s.file}</div></div>`;});
    html+=`</div></div>`;
  });
  document.getElementById('mc').innerHTML=html;
}
function openSlot(f,label){
  _slot=f;_sb64=null;
  openModal(`<button class="mclose" onclick="closeModal()">&#10005;</button><div class="mtitle">Adicionar <span class="r">${label}</span></div><div style="background:rgba(255,255,255,.04);border:1px solid var(--divider);border-radius:6px;padding:.55rem .85rem;margin-bottom:.9rem;font-size:.73rem;color:var(--gray)">Ficheiro: <code style="color:var(--blue-lt)">img/${f}</code></div><div onclick="document.getElementById('sfi').click()" style="border:2px dashed rgba(255,255,255,.15);border-radius:10px;padding:2rem 1rem;text-align:center;cursor:pointer;margin-bottom:.9rem" id="sdz"><i class="fa-solid fa-cloud-arrow-up" style="font-size:2rem;color:var(--gray);margin-bottom:.5rem;display:block"></i><div style="font-size:.85rem;color:var(--gray-lt)">Clique para seleccionar</div><div style="font-size:.7rem;color:var(--gray);margin-top:.2rem">JPG, PNG, WEBP — máx. 5MB</div><input type="file" id="sfi" accept="image/*" style="display:none" onchange="slotPrev(this)"></div><div id="spa" style="display:none;margin-bottom:.9rem;text-align:center"><img id="spi" style="max-height:140px;max-width:100%;border-radius:8px;border:1px solid var(--divider)"><div id="sii" style="font-size:.7rem;color:var(--gray);margin-top:.35rem"></div></div><div id="sus" style="display:none;margin-bottom:.7rem;font-size:.78rem;padding:.65rem;border-radius:6px;background:rgba(255,255,255,.04)"></div><div class="mact"><button class="btn bgh" onclick="closeModal()">Cancelar</button><button class="btn bred" onclick="doUpload()"><i class="fa-solid fa-upload"></i> Publicar</button></div>`);
}
function slotPrev(inp){if(!inp.files[0])return;const f=inp.files[0];if(f.size>5*1024*1024)return toast('Máx. 5MB','error');const r=new FileReader();r.onload=e=>{_sb64=e.target.result.split(',')[1];document.getElementById('spi').src=e.target.result;document.getElementById('sii').textContent=f.name+' · '+(f.size/1024).toFixed(1)+'KB';document.getElementById('spa').style.display='block';document.getElementById('sdz').style.borderColor='rgba(34,197,94,.4)';};r.readAsDataURL(f);}
async function doUpload(){
  if(!_sb64)return toast('Seleccione uma imagem','error');
  if(!ghOk())return toast('Configure o GitHub','error');
  const path='img/'+_slot,s=document.getElementById('sus');
  s.style.display='block';s.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> A publicar...';
  try{
    let sha=null;try{const ex=await ghGet(path);sha=ex.sha;}catch(e){}
    const body={message:'Admin: upload '+_slot,content:_sb64,branch:GH_CFG.branch||'main'};
    if(sha)body.sha=sha;
    const r=await fetch('https://api.github.com/repos/'+GH_CFG.owner+'/'+GH_CFG.repo+'/contents/'+path,{method:'PUT',headers:ghH(),body:JSON.stringify(body)});
    if(!r.ok){const e=await r.json();throw new Error(e.message);}
    s.innerHTML='<i class="fa-solid fa-circle-check" style="color:var(--green)"></i> Publicado!';
    toast(_slot+' publicado!','success');
    const el=document.getElementById('sl_'+_slot.replace(/[^a-z0-9]/gi,'_'));
    if(el)el.classList.add('done');
    setTimeout(closeModal,1200);
  }catch(ex){s.innerHTML='<i class="fa-solid fa-circle-xmark" style="color:var(--red)"></i> Erro: '+ex.message;toast('Erro: '+ex.message,'error');}
}

// ─── SOBRE NÓS ───
let _sc='',_ss=null,_eq=[];
function rSobre(){
  document.getElementById('mc').innerHTML=`
    <div class="ph"><div class="pt">Editar <span class="b">Sobre Nós</span></div><div class="ps">Textos e equipa de sobre.html</div></div>
    <div class="brow">
      <button class="btn bred" onclick="loadSobre()"><i class="fa-solid fa-rotate"></i> Carregar</button>
      ${_sc?'<button class="btn bgrn" onclick="saveSobre()"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>':''}
    </div>
    <div id="se">${_sc?buildSobreEd():'<div class="empty"><i class="fa-solid fa-file-lines"></i><p>Clique em Carregar para editar</p></div>'}</div>`;
}
function buildSobreEd(){
  const m=_sc.match(/<!-- ADMIN:HISTORIA:START -->([\s\S]*?)<!-- ADMIN:HISTORIA:END -->/);
  const hh=m?m[1]:'';const pts=[];const pr=/<p[^>]*>([\s\S]*?)<\/p>/g;let pm;
  while((pm=pr.exec(hh))!==null){const t=pm[1].replace(/<[^>]+>/g,'').trim();if(t&&!t.startsWith('<a'))pts.push(t);}
  const em=_sc.match(/<!-- ADMIN:EQUIPA:START -->([\s\S]*?)<!-- ADMIN:EQUIPA:END -->/);
  _eq=[];
  if(em){const cr=/<div class="membro-card[^"]*"[\s\S]*?<div class="membro-nome">([\s\S]*?)<\/div>[\s\S]*?<div class="membro-cargo">([\s\S]*?)<\/div>[\s\S]*?<div class="membro-bio">([\s\S]*?)<\/div>/g;let cm;while((cm=cr.exec(em[1]))!==null)_eq.push({nome:cm[1].trim(),cargo:cm[2].trim(),bio:cm[3].trim()});}
  let html=`<div class="card"><div class="ct"><i class="fa-solid fa-clock-rotate-left"></i> Texto da História</div>`;
  pts.forEach((t,i)=>{html+=`<div class="fg"><label class="fl">Parágrafo ${i+1}</label><textarea class="fi" id="hp${i}" style="min-height:80px">${t}</textarea></div>`;});
  html+=`<input type="hidden" id="hpc" value="${pts.length}"><button class="btn bgh bfull" style="margin-top:.4rem" onclick="applyH()"><i class="fa-solid fa-check"></i> Aplicar</button></div>`;
  html+=`<div class="card"><div class="ct"><i class="fa-solid fa-users"></i> Equipa</div>`;
  _eq.forEach((m,i)=>{html+=`<div style="background:rgba(255,255,255,.03);border:1px solid var(--divider);border-radius:8px;padding:.85rem;margin-bottom:.75rem"><div class="fg"><label class="fl">Nome</label><input class="fi" id="mn${i}" value="${m.nome}"></div><div class="fg"><label class="fl">Cargo</label><input class="fi" id="mc${i}" value="${m.cargo}"></div><div class="fg" style="margin-bottom:0"><label class="fl">Biografia</label><textarea class="fi" id="mb${i}" style="min-height:65px">${m.bio}</textarea></div></div>`;});
  html+=`<input type="hidden" id="eqc" value="${_eq.length}"></div>`;
  return html;
}
async function loadSobre(){
  if(!ghOk())return toast('Configure o GitHub','error');
  document.getElementById('se').innerHTML='<div class="load"><div class="spin"></div> A carregar...</div>';
  try{const r=await ghGet('sobre.html');_sc=r.content;_ss=r.sha;toast('Carregado!','success');rSobre();}
  catch(e){toast('Erro: '+e.message,'error');}
}
function applyH(){
  if(!_sc)return;
  const cnt=parseInt(document.getElementById('hpc').value);
  const m=_sc.match(/<!-- ADMIN:HISTORIA:START -->([\s\S]*?)<!-- ADMIN:HISTORIA:END -->/);
  if(!m)return toast('Marcador não encontrado','error');
  let idx=0,newH=m[1].replace(/<p([^>]*)>([\s\S]*?)<\/p>/g,(full,attrs,inner)=>{
    const t=inner.replace(/<[^>]+>/g,'').trim();if(!t||t.startsWith('<a'))return full;
    const el=document.getElementById('hp'+idx);idx++;return el?'<p'+attrs+'>'+el.value+'</p>':full;
  });
  _sc=_sc.replace(m[0],'<!-- ADMIN:HISTORIA:START -->'+newH+'<!-- ADMIN:HISTORIA:END -->');
  toast('Texto aplicado — clique em Guardar','info');
}
async function saveSobre(){
  if(!ghOk()||!_sc)return toast('Carregue primeiro','error');
  applyH();
  const ec=document.getElementById('eqc');
  if(ec){
    const cnt=parseInt(ec.value),em=_sc.match(/<!-- ADMIN:EQUIPA:START -->([\s\S]*?)<!-- ADMIN:EQUIPA:END -->/);
    if(em){let ne=em[1];for(let i=0;i<cnt;i++){const n=document.getElementById('mn'+i),c=document.getElementById('mc'+i),b=document.getElementById('mb'+i);if(n){ne=ne.replace(_eq[i].nome,n.value);ne=ne.replace(_eq[i].cargo,c.value);ne=ne.replace(_eq[i].bio,b.value);}}_sc=_sc.replace(em[0],'<!-- ADMIN:EQUIPA:START -->'+ne+'<!-- ADMIN:EQUIPA:END -->');}
  }
  try{await ghPut('sobre.html',_sc,_ss,'Admin: sobre.html');_ss=null;toast('Guardado!','success');}
  catch(e){toast('Erro: '+e.message,'error');}
}
</script>
</body>
