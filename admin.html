<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin — IMPERSILVA</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#0e0e0f;--dark:#161618;--charcoal:#242428;--charcoal-lt:#2e2e33;
  --red:#d62828;--red-lt:#e84040;--red-dim:rgba(214,40,40,.12);
  --blue:#1d4ed8;--blue-lt:#3b6ef0;--blue-dim:rgba(29,78,216,.12);
  --green:#22c55e;--green-dim:rgba(34,197,94,.12);
  --white:#fff;--gray:#888896;--gray-lt:#c0c0cc;--divider:rgba(255,255,255,.07);
  --sidebar:240px;
}
body{font-family:'Barlow',sans-serif;background:var(--dark);color:var(--white);min-height:100vh}
/* ─── LOGIN ─── */
#loginScreen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--black);
  background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
  background-size:60px 60px;
}
.login-box{
  background:var(--charcoal);border:1px solid var(--divider);border-radius:16px;
  padding:2.5rem;width:100%;max-width:380px;text-align:center;
}
.login-logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:2rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.2rem}
.login-logo .r{color:var(--red)}.login-logo .b{color:var(--blue-lt)}
.login-sub{font-size:.6rem;letter-spacing:.28em;color:var(--gray);text-transform:uppercase;margin-bottom:2rem}
.login-title{font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--gray);margin-bottom:1.5rem}
.login-inp{
  width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
  border-radius:6px;padding:.85rem 1rem;color:var(--white);font-family:'Barlow',sans-serif;
  font-size:.95rem;outline:none;margin-bottom:1rem;transition:border-color .2s;
}
.login-inp:focus{border-color:var(--red)}
.login-btn{
  width:100%;background:var(--red);color:#fff;border:none;border-radius:6px;
  padding:.9rem;font-family:'Barlow',sans-serif;font-size:.88rem;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .2s;
}
.login-btn:hover{background:var(--red-lt)}
.login-err{color:var(--red);font-size:.78rem;margin-top:.7rem;display:none}
/* ─── APP LAYOUT ─── */
#app{display:none;min-height:100vh}
#sidebar{
  position:fixed;left:0;top:0;bottom:0;width:var(--sidebar);
  background:var(--black);border-right:1px solid var(--divider);
  display:flex;flex-direction:column;z-index:100;overflow-y:auto;
}
.sb-logo{padding:1.5rem 1.2rem 1rem;border-bottom:1px solid var(--divider)}
.sb-logo-txt{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.4rem;text-transform:uppercase;letter-spacing:.05em}
.sb-logo-txt .r{color:var(--red)}.sb-logo-txt .b{color:var(--blue-lt)}
.sb-logo-sub{font-size:.5rem;letter-spacing:.22em;color:var(--gray);text-transform:uppercase;margin-top:1px}
.sb-badge{font-size:.55rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:var(--red-dim);color:var(--red);border:1px solid rgba(214,40,40,.25);padding:.15rem .45rem;border-radius:3px;margin-top:.5rem;display:inline-block}
.sb-nav{flex:1;padding:.8rem 0}
.sb-item{
  display:flex;align-items:center;gap:.7rem;padding:.7rem 1.2rem;
  font-size:.82rem;font-weight:500;color:var(--gray);cursor:pointer;
  border-left:2px solid transparent;transition:all .18s;text-decoration:none;
}
.sb-item:hover{color:var(--white);background:rgba(255,255,255,.03)}
.sb-item.active{color:var(--white);border-left-color:var(--red);background:var(--red-dim)}
.sb-item .icon{font-size:1rem;width:20px;text-align:center}
.sb-section{font-size:.58rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.2);padding:.8rem 1.2rem .3rem}
.sb-footer{padding:1rem 1.2rem;border-top:1px solid var(--divider)}
.sb-user{font-size:.72rem;color:var(--gray);margin-bottom:.5rem}
.sb-logout{font-size:.72rem;color:var(--red);cursor:pointer;background:none;border:none;font-family:'Barlow',sans-serif;padding:0}
.sb-logout:hover{color:var(--red-lt)}
#main{margin-left:var(--sidebar);min-height:100vh;background:var(--dark)}
.main-header{
  background:var(--black);border-bottom:1px solid var(--divider);
  padding:1.2rem 2rem;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;
}
.main-header-title{font-family:'Barlow Condensed',sans-serif;font-size:1.2rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.main-content{padding:2rem}
/* ─── CARDS/COMPONENTS ─── */
.page-title{font-family:'Barlow Condensed',sans-serif;font-size:1.7rem;font-weight:900;text-transform:uppercase;letter-spacing:.03em;margin-bottom:.4rem}
.page-title .r{color:var(--red)}.page-title .b{color:var(--blue-lt)}
.page-sub{font-size:.85rem;color:var(--gray);font-weight:300;margin-bottom:2rem}
.card{background:var(--charcoal);border:1px solid var(--divider);border-radius:12px;padding:1.5rem;margin-bottom:1.5rem}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:.8rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gray);margin-bottom:1.2rem;padding-bottom:.7rem;border-bottom:1px solid var(--divider)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.stat-card{background:var(--charcoal);border:1px solid var(--divider);border-radius:10px;padding:1.2rem;text-align:center}
.stat-num{font-family:'Barlow Condensed',sans-serif;font-size:2rem;font-weight:900;color:var(--white)}
.stat-lbl{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gray);margin-top:.2rem}
/* ─── FORM ELEMENTS ─── */
.fgroup{margin-bottom:1.1rem}
.flabel{display:block;font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gray-lt);margin-bottom:.4rem}
.finput{
  width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
  border-radius:6px;padding:.75rem .9rem;color:var(--white);font-family:'Barlow',sans-serif;
  font-size:.88rem;font-weight:300;outline:none;transition:border-color .2s;
}
.finput:focus{border-color:var(--red)}
.finput::placeholder{color:rgba(255,255,255,.2)}
.finput option{background:var(--charcoal);color:var(--white)}
textarea.finput{resize:vertical;min-height:80px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
/* ─── BUTTONS ─── */
.btn{display:inline-flex;align-items:center;gap:.4rem;font-family:'Barlow',sans-serif;font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.65rem 1.3rem;border:none;border-radius:5px;cursor:pointer;transition:all .2s;text-decoration:none}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:var(--red-lt)}
.btn-blue{background:var(--blue);color:#fff}.btn-blue:hover{background:var(--blue-lt)}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{opacity:.9}
.btn-ghost{background:transparent;color:var(--gray-lt);border:1px solid rgba(255,255,255,.12)}.btn-ghost:hover{border-color:var(--white);color:var(--white)}
.btn-danger{background:rgba(214,40,40,.15);color:var(--red);border:1px solid rgba(214,40,40,.3)}.btn-danger:hover{background:var(--red);color:#fff}
.btn-sm{padding:.4rem .8rem;font-size:.7rem}
/* ─── TABLE ─── */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:.65rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gray);text-align:left;padding:.6rem .8rem;border-bottom:1px solid var(--divider)}
.tbl td{font-size:.83rem;padding:.75rem .8rem;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:rgba(255,255,255,.02)}
/* ─── BADGES ─── */
.badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:.2rem .55rem;border-radius:50px}
.badge-green{background:var(--green-dim);color:var(--green);border:1px solid rgba(34,197,94,.3)}
.badge-red{background:var(--red-dim);color:var(--red);border:1px solid rgba(214,40,40,.3)}
.badge-blue{background:var(--blue-dim);color:var(--blue-lt);border:1px solid rgba(29,78,216,.3)}
.badge-gray{background:rgba(255,255,255,.05);color:var(--gray);border:1px solid rgba(255,255,255,.1)}
/* ─── MODAL ─── */
#modalOverlay{
  position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:999;
  display:none;align-items:center;justify-content:center;padding:1rem;
}
#modalOverlay.open{display:flex}
.modal{
  background:var(--charcoal);border:1px solid var(--divider);border-radius:14px;
  padding:2rem;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;
  position:relative;
}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-size:1.2rem;font-weight:800;text-transform:uppercase;margin-bottom:1.5rem}
.modal-title .r{color:var(--red)}.modal-title .b{color:var(--blue-lt)}
.modal-close{position:absolute;top:1rem;right:1rem;background:none;border:none;color:var(--gray);font-size:1.3rem;cursor:pointer;line-height:1}
.modal-close:hover{color:var(--white)}
.modal-actions{display:flex;gap:.8rem;margin-top:1.5rem;justify-content:flex-end}
/* ─── TOAST ─── */
#toast{
  position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;
  background:var(--charcoal);border:1px solid var(--divider);
  border-radius:8px;padding:.85rem 1.2rem;
  font-size:.82rem;min-width:220px;max-width:360px;
  display:flex;align-items:center;gap:.7rem;
  opacity:0;transform:translateY(10px);
  transition:all .25s;pointer-events:none;
  box-shadow:0 8px 30px rgba(0,0,0,.4);
}
#toast.show{opacity:1;transform:translateY(0)}
#toast.success{border-color:rgba(34,197,94,.4)}
#toast.error{border-color:rgba(214,40,40,.4)}
.toast-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.toast-dot.green{background:var(--green)}
.toast-dot.red{background:var(--red)}
.toast-dot.blue{background:var(--blue-lt)}
/* ─── PORTFOLIO CARD PREVIEW ─── */
.port-card-row{
  background:rgba(255,255,255,.03);border:1px solid var(--divider);
  border-radius:8px;padding:1rem;margin-bottom:.7rem;
  display:flex;align-items:flex-start;gap:1rem;
}
.port-card-num{
  font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;font-weight:900;
  color:var(--gray);min-width:24px;text-align:center;padding-top:2px;
}
.port-card-info{flex:1}
.port-card-name{font-family:'Barlow Condensed',sans-serif;font-size:.95rem;font-weight:700;text-transform:uppercase;color:var(--white);margin-bottom:.2rem}
.port-card-desc{font-size:.78rem;color:var(--gray);font-weight:300;line-height:1.5}
.port-card-meta{display:flex;gap:.5rem;margin-top:.4rem;align-items:center}
.port-card-actions{display:flex;gap:.4rem;flex-shrink:0}
/* ─── STATUS DOT ─── */
.dot-online{width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
/* ─── ID DISPLAY ─── */
.client-id{
  font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:700;
  letter-spacing:.12em;background:rgba(255,255,255,.05);
  border:1px solid var(--divider);border-radius:4px;
  padding:.2rem .5rem;cursor:pointer;transition:background .2s;
}
.client-id:hover{background:rgba(255,255,255,.08)}
/* ─── LOADING ─── */
.loading{
  display:flex;align-items:center;justify-content:center;gap:.6rem;
  font-size:.82rem;color:var(--gray);padding:2rem;
}
.spinner{
  width:18px;height:18px;border:2px solid var(--divider);
  border-top-color:var(--red);border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
/* ─── DIVIDER ─── */
.divider{height:1px;background:var(--divider);margin:1.5rem 0}
/* ─── PROGRESS BAR ─── */
.progress-bar{height:4px;background:var(--divider);border-radius:2px;overflow:hidden;margin-top:.5rem}
.progress-fill{height:100%;background:linear-gradient(to right,var(--red),var(--blue-lt));transition:width .3s}
/* ─── RESPONSIVE ─── */
@media(max-width:768px){
  #sidebar{width:100%;height:auto;position:relative;flex-direction:row;flex-wrap:wrap}
  #main{margin-left:0}
  .grid-2,.grid-3,.frow{grid-template-columns:1fr}
}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--gray)}
.empty-state-icon{font-size:2.5rem;margin-bottom:.8rem;opacity:.4}
.empty-state-text{font-size:.88rem;font-weight:300}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">IMPERSIL<span class="r">V</span><span class="b">Λ</span></div>
    <div class="login-sub">Holding SGPS</div>
    <div class="login-title">Painel de Administração</div>
    <input class="login-inp" type="password" id="loginPass" placeholder="Password de acesso" autocomplete="current-password">
    <button class="login-btn" onclick="doLogin()">Entrar</button>
    <div class="login-err" id="loginErr">Password incorrecta. Tente novamente.</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="sb-logo">
      <div class="sb-logo-txt">IMPERSIL<span class="r">V</span><span class="b">Λ</span></div>
      <div class="sb-logo-sub">Holding SGPS</div>
      <div class="sb-badge">Admin</div>
    </div>
    <nav class="sb-nav">
      <div class="sb-section">Geral</div>
      <div class="sb-item active" data-s="painel" onclick="nav(this,'painel')"><span class="icon">▦</span> Painel</div>
      <div class="sb-item" data-s="github" onclick="nav(this,'github')"><span class="icon">⚙</span> GitHub Config</div>
      <div class="sb-section">Conteúdo</div>
      <div class="sb-item" data-s="contactos" onclick="nav(this,'contactos')"><span class="icon">✆</span> Contactos</div>
      <div class="sb-item" data-s="portfolio" onclick="nav(this,'portfolio')"><span class="icon">◧</span> Portfólio</div>
      <div class="sb-item" data-s="depoimentos" onclick="nav(this,'depoimentos')"><span class="icon">❝</span> Depoimentos</div>
      <div class="sb-section">Clientes</div>
      <div class="sb-item" data-s="clientes" onclick="nav(this,'clientes')"><span class="icon">◉</span> Sites de Clientes</div>
    </nav>
    <div class="sb-footer">
      <div class="sb-user" id="sbUser">Administrador</div>
      <button class="sb-logout" onclick="doLogout()">Terminar sessão</button>
    </div>
  </aside>

  <!-- MAIN -->
  <div id="main">
    <div class="main-header">
      <div class="main-header-title" id="mainTitle">Painel</div>
      <div style="display:flex;align-items:center;gap:.5rem">
        <div class="dot-online"></div>
        <span style="font-size:.72rem;color:var(--gray)">Ligado</span>
      </div>
    </div>
    <div class="main-content" id="mainContent"></div>
  </div>
</div>

<!-- MODAL -->
<div id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBox"></div>
</div>

<!-- TOAST -->
<div id="toast"><div class="toast-dot" id="toastDot"></div><span id="toastMsg"></span></div>

<script>
// ══════════════════════════════════════════════
// CONFIG & STATE
// ══════════════════════════════════════════════
const ADMIN_PASS = 'impersilva@2026'; // Altere aqui a sua password

let GH_CFG = JSON.parse(localStorage.getItem('gh_cfg') || '{}');
let CURRENT = 'painel';
let _toastTimer;

const SECTION_TITLES = {
  painel:'Painel', github:'GitHub Config', contactos:'Contactos',
  portfolio:'Portfólio', depoimentos:'Depoimentos', clientes:'Sites de Clientes'
};

// ══════════════════════════════════════════════
// AUTH
// ══════════════════════════════════════════════
function doLogin() {
  const pass = document.getElementById('loginPass').value;
  if (pass === ADMIN_PASS) {
    localStorage.setItem('adm_session', '1');
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    render('painel');
  } else {
    document.getElementById('loginErr').style.display = 'block';
    document.getElementById('loginPass').value = '';
    document.getElementById('loginPass').focus();
  }
}
document.getElementById('loginPass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
if (localStorage.getItem('adm_session')) {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  render('painel');
}
function doLogout() {
  localStorage.removeItem('adm_session');
  location.reload();
}

// ══════════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════════
function nav(el, section) {
  document.querySelectorAll('.sb-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  render(section);
}
function render(section) {
  CURRENT = section;
  document.getElementById('mainTitle').textContent = SECTION_TITLES[section] || section;
  const fns = { painel:renderPainel, github:renderGithub, contactos:renderContactos,
                portfolio:renderPortfolio, depoimentos:renderDepoimentos, clientes:renderClientes };
  const fn = fns[section];
  if (fn) fn();
}

// ══════════════════════════════════════════════
// GITHUB API
// ══════════════════════════════════════════════
function ghHeaders() {
  return {
    'Authorization': `token ${GH_CFG.token}`,
    'Accept': 'application/vnd.github.v3+json',
    'Content-Type': 'application/json'
  };
}
function b64enc(str) { return btoa(unescape(encodeURIComponent(str))); }
function b64dec(str) { return decodeURIComponent(escape(atob(str.replace(/\n/g,'')))); }

async function ghGet(path) {
  const r = await fetch(`https://api.github.com/repos/${GH_CFG.owner}/${GH_CFG.repo}/contents/${path}?ref=${GH_CFG.branch||'main'}`, { headers: ghHeaders() });
  if (!r.ok) { const e = await r.json(); throw new Error(e.message || `GET failed ${r.status}`); }
  const d = await r.json();
  return { content: b64dec(d.content), sha: d.sha };
}
async function ghPut(path, content, sha, msg) {
  const body = { message: msg, content: b64enc(content), branch: GH_CFG.branch || 'main' };
  if (sha) body.sha = sha;
  const r = await fetch(`https://api.github.com/repos/${GH_CFG.owner}/${GH_CFG.repo}/contents/${path}`, {
    method: 'PUT', headers: ghHeaders(), body: JSON.stringify(body)
  });
  if (!r.ok) { const e = await r.json(); throw new Error(e.message || `PUT failed ${r.status}`); }
  return r.json();
}
function ghReady() { return GH_CFG.token && GH_CFG.owner && GH_CFG.repo; }

// ══════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════
function toast(msg, type='success') {
  const el = document.getElementById('toast');
  const dot = document.getElementById('toastDot');
  document.getElementById('toastMsg').textContent = msg;
  dot.className = 'toast-dot ' + (type==='success'?'green':type==='error'?'red':'blue');
  el.className = 'show ' + type;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.className = type; }, 3500);
}

// ══════════════════════════════════════════════
// MODAL
// ══════════════════════════════════════════════
function openModal(html) {
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

// ══════════════════════════════════════════════
// SECTION: PAINEL
// ══════════════════════════════════════════════
function renderPainel() {
  const connected = ghReady();
  document.getElementById('mainContent').innerHTML = `
    <div class="page-title">Bem-vindo ao <span class="r">Admin</span></div>
    <div class="page-sub">Gerir o site IMPERSILVA HOLDING SGPS</div>
    <div class="grid-3" style="margin-bottom:1.5rem">
      <div class="stat-card">
        <div class="stat-num" id="statClientes">—</div>
        <div class="stat-lbl">Sites de Clientes</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">10</div>
        <div class="stat-lbl">Cards no Portfólio</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">6</div>
        <div class="stat-lbl">Páginas no Site</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Estado da Ligação GitHub</div>
      ${connected ? `
        <div style="display:flex;align-items:center;gap:.7rem;margin-bottom:.5rem">
          <div class="dot-online"></div>
          <span style="font-size:.88rem">Repositório: <strong>${GH_CFG.owner}/${GH_CFG.repo}</strong></span>
        </div>
        <div style="font-size:.78rem;color:var(--gray)">Branch: ${GH_CFG.branch||'main'} · Token configurado</div>
        <button class="btn btn-blue" style="margin-top:1rem" onclick="testGithub()">Testar Ligação</button>

      </div>

    </div>
    <div id="ctProgress" style="display:none">
      <div class="card">
        <div class="card-title">Progresso da Actualização</div>
        <div id="ctLog" style="font-size:.78rem;color:var(--gray);line-height:2;font-family:monospace"></div>
        <div class="progress-bar"><div class="progress-fill" id="ctBar" style="width:0%"></div></div>
      </div>
    </div>
  `;
}
async function saveContactos() {
  if (!ghReady()) return toast('Configure o GitHub primeiro', 'error');
  const phone = document.getElementById('ctPhone').value.trim();
  const wpp   = document.getElementById('ctWpp').value.trim();
  const loc   = document.getElementById('ctLoc').value.trim();
  if (!phone || !wpp) return toast('Preencha os campos obrigatórios', 'error');

  const files = ['index.html','sobre.html','consultoria.html','tech.html','projetos.html','contacto.html'];
  document.getElementById('ctProgress').style.display = 'block';
  const log = document.getElementById('ctLog');
  const bar = document.getElementById('ctBar');
  let done = 0;

  for (const file of files) {
    try {
      log.innerHTML += `<span style="color:var(--blue-lt)">→ A ler ${file}...</span>\n`;
      const { content, sha } = await ghGet(file);
      let updated = content;
      // Replace phone patterns
      updated = updated.replace(/\+244 \d{3} \d{3} \d{3}/g, phone);
      updated = updated.replace(/tel:\+244\d+/g, `tel:${phone.replace(/\s/g,'')}`);
      // Replace WhatsApp patterns
      updated = updated.replace(/wa\.me\/\d{12,}/g, `wa.me/${wpp}`);
      updated = updated.replace(/244\d{9}/g, wpp);
      // Replace location
      if (loc) updated = updated.replace(/Huambo, Angola/g, loc);
      await ghPut(file, updated, sha, `Admin: actualizar contactos em ${file}`);
      done++;
      bar.style.width = (done/files.length*100)+'%';
      log.innerHTML += `<span style="color:var(--green)">✓ ${file} actualizado</span>\n`;
    } catch (e) {
      log.innerHTML += `<span style="color:var(--red)">✗ Erro em ${file}: ${e.message}</span>\n`;
    }
    await new Promise(r => setTimeout(r, 400));
  }
  toast(`${done} ficheiros actualizados!`, done===files.length?'success':'error');
}

    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">Novo <span class="r">Depoimento</span></div>
    <div class="fgroup"><label class="flabel">Nome do Cliente</label><input class="finput" id="dpName" placeholder="ex: João Silva"></div>
    <div class="fgroup"><label class="flabel">Sector / Localização</label><input class="finput" id="dpRole" placeholder="ex: Restaurante — Luanda"></div>
    <div class="fgroup"><label class="flabel">Depoimento</label><textarea class="finput" id="dpText" placeholder="O que o cliente disse..."></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-red" onclick="addDepo()">Adicionar</button>
    </div>
  `);
}
function addDepo() {
  const name = document.getElementById('dpName').value.trim();
  const role = document.getElementById('dpRole').value.trim();
  const text = document.getElementById('dpText').value.trim();
  if (!name||!role||!text) return toast('Preencha todos os campos', 'error');
  depoList.push({name,role,text});
  closeModal(); renderDepoimentos();
  toast('Depoimento adicionado — guarde no GitHub', 'info');
}
function editDepo(i) {
  const d = depoList[i];
  openModal(`
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">Editar <span class="r">Depoimento</span></div>
    <div class="fgroup"><label class="flabel">Nome</label><input class="finput" id="dpName" value="${d.name}"></div>
    <div class="fgroup"><label class="flabel">Sector / Localização</label><input class="finput" id="dpRole" value="${d.role}"></div>
    <div class="fgroup"><label class="flabel">Depoimento</label><textarea class="finput" id="dpText">${d.text}</textarea></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-red" onclick="updateDepo(${i})">Guardar</button>
    </div>
  `);
}
function updateDepo(i) {
  depoList[i] = { name:document.getElementById('dpName').value.trim(), role:document.getElementById('dpRole').value.trim(), text:document.getElementById('dpText').value.trim() };
  closeModal(); renderDepoimentos();
  toast('Actualizado — guarde no GitHub', 'info');
}
function deleteDepo(i) {
  if (!confirm(`Remover depoimento de "${depoList[i].name}"?`)) return;
  depoList.splice(i,1); renderDepoimentos();
  toast('Removido — guarde no GitHub', 'info');
}

// ══════════════════════════════════════════════
// SECTION: CLIENTES (SITES)
// ══════════════════════════════════════════════
let clientsList = [];
let clientsSha = null;

function genId() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({length:8}, () => chars[Math.floor(Math.random()*chars.length)]).join('');
}

function renderClientes() {
  document.getElementById('mainContent').innerHTML = `
    <div class="page-title">Sites de <span class="r">Clien</span><span class="b">tes</span></div>
    <div class="page-sub">Gere os sites criados para clientes. Cada cliente recebe um ID único para aceder ao seu site no portal.</div>
    <div style="display:flex;gap:.8rem;margin-bottom:1.5rem;flex-wrap:wrap;align-items:center">
      <button class="btn btn-red" onclick="loadClients()">↻ Carregar</button>
      <button class="btn btn-blue" onclick="openAddClient()">+ Novo Cliente</button>
      ${clientsList.length>0?`<button class="btn btn-green" onclick="saveClients()">↑ Guardar no GitHub</button>`:''}
      <a class="btn btn-ghost" href="verificar-site.html" target="_blank">↗ Ver Portal de Clientes</a>
    </div>
    <div id="clientListEl">
      ${clientsList.length===0 ? `
        <div class="empty-state"><div class="empty-state-icon">◉</div><div class="empty-state-text">Clique em "Carregar" para ver os clientes registados</div></div>
      ` : renderClientTable()}
    </div>
  `;
}
function renderClientTable() {
  if (clientsList.length === 0) return '<div class="empty-state"><div class="empty-state-icon">◉</div><div class="empty-state-text">Nenhum cliente registado ainda</div></div>';
  return `
    <div class="card" style="overflow-x:auto">
      <table class="tbl">
        <thead><tr>
          <th>ID</th><th>Nome</th><th>Tipo</th><th>URL</th><th>Data</th><th>Estado</th><th>Acções</th>
        </tr></thead>
        <tbody>${clientsList.map((c,i) => `
          <tr>
            <td><span class="client-id" onclick="copyId('${c.id}')" title="Clique para copiar">${c.id}</span></td>
            <td style="font-weight:500">${c.nome}</td>
            <td><span class="badge badge-blue">${c.tipo||'Site'}</span></td>
            <td><a href="${c.url}" target="_blank" style="color:var(--blue-lt);font-size:.78rem;text-decoration:none">${c.url.length>35?c.url.substring(0,35)+'…':c.url}</a></td>
            <td style="color:var(--gray);font-size:.78rem">${c.criado||'—'}</td>
            <td><span class="badge ${c.activo?'badge-green':'badge-gray'}">${c.activo?'Activo':'Inactivo'}</span></td>
            <td style="white-space:nowrap">
              <button class="btn btn-ghost btn-sm" onclick="editClient(${i})">Editar</button>
              <button class="btn btn-ghost btn-sm" onclick="shareClient(${i})" style="color:var(--blue-lt)">Partilhar</button>
              <button class="btn btn-danger btn-sm" onclick="deleteClient(${i})">✕</button>
            </td>
          </tr>
        `).join('')}</tbody>
      </table>
    </div>
  `;
}
async function loadClients() {
  if (!ghReady()) return toast('Configure o GitHub primeiro', 'error');
  document.getElementById('clientListEl').innerHTML = '<div class="loading"><div class="spinner"></div> A carregar clients.json...</div>';
  try {
    const { content, sha } = await ghGet('data/clients.json');
    clientsSha = sha;
    clientsList = JSON.parse(content);
    toast(`${clientsList.length} clientes carregados`, 'success');
  } catch(e) {
    if (e.message.includes('404') || e.message.includes('Not Found')) {
      clientsList = []; clientsSha = null;
      toast('Ficheiro não existe ainda — será criado ao guardar', 'info');
    } else { toast('Erro: ' + e.message, 'error'); }
  }
  renderClientes();
}
async function saveClients() {
  if (!ghReady()) return toast('Configure o GitHub primeiro', 'error');
  try {
    const content = JSON.stringify(clientsList, null, 2);
    await ghPut('data/clients.json', content, clientsSha, 'Admin: actualizar lista de clientes');
    clientsSha = null;
    toast('Clientes guardados no GitHub!', 'success');
    await loadClients();
  } catch(e) { toast('Erro: ' + e.message, 'error'); }
}
function openAddClient() {
  const newId = genId();
  openModal(`
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">Novo <span class="r">Cliente</span></div>
    <div class="fgroup">
      <label class="flabel">ID do Cliente</label>
      <div style="display:flex;gap:.5rem">
        <input class="finput" id="clId" value="${newId}" style="font-family:monospace;letter-spacing:.1em">
        <button class="btn btn-ghost btn-sm" onclick="document.getElementById('clId').value=genId()">↻ Novo</button>
      </div>
      <div style="font-size:.7rem;color:var(--gray);margin-top:.3rem">Este código será usado pelo cliente para aceder ao seu site</div>
    </div>
    <div class="fgroup"><label class="flabel">Nome do Cliente / Empresa</label><input class="finput" id="clNome" placeholder="ex: Belle Cosméticos"></div>
    <div class="fgroup"><label class="flabel">Tipo de Site</label>
      <select class="finput" id="clTipo">
        <option>Site de Vendas</option><option>Loja Online</option>
        <option>Site Institucional</option><option>Site Pessoal</option>
        <option>Redes Sociais</option><option>Pacote Completo</option><option>Outro</option>
      </select>
    </div>
    <div class="fgroup"><label class="flabel">URL do Site</label><input class="finput" id="clUrl" placeholder="https://impersilvatech.github.io/nome-site/"></div>
    <div class="frow">
      <div class="fgroup"><label class="flabel">Data de Criação</label><input class="finput" type="date" id="clData" value="${new Date().toISOString().split('T')[0]}"></div>
      <div class="fgroup"><label class="flabel">Estado</label>
        <select class="finput" id="clActivo"><option value="true">Activo</option><option value="false">Inactivo</option></select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-red" onclick="addClient()">Adicionar Cliente</button>
    </div>
  `);
}
function addClient() {
  const id    = document.getElementById('clId').value.trim().toUpperCase();
  const nome  = document.getElementById('clNome').value.trim();
  const url   = document.getElementById('clUrl').value.trim();
  if (!id||!nome||!url) return toast('Preencha ID, nome e URL', 'error');
  if (clientsList.find(c => c.id === id)) return toast('Este ID já existe!', 'error');
  clientsList.push({
    id, nome, url,
    tipo: document.getElementById('clTipo').value,
    criado: document.getElementById('clData').value,
    activo: document.getElementById('clActivo').value === 'true'
  });
  closeModal(); renderClientes();
  toast('Cliente adicionado — clique em "Guardar no GitHub"', 'info');
}
function editClient(i) {
  const c = clientsList[i];
  openModal(`
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">Editar <span class="r">Cliente</span></div>
    <div class="fgroup"><label class="flabel">ID</label><input class="finput" id="clId" value="${c.id}" style="font-family:monospace;letter-spacing:.1em"></div>
    <div class="fgroup"><label class="flabel">Nome</label><input class="finput" id="clNome" value="${c.nome}"></div>
    <div class="fgroup"><label class="flabel">Tipo</label>
      <select class="finput" id="clTipo">
        ${['Site de Vendas','Loja Online','Site Institucional','Site Pessoal','Redes Sociais','Pacote Completo','Outro'].map(t=>`<option ${c.tipo===t?'selected':''}>${t}</option>`).join('')}
      </select>
    </div>
    <div class="fgroup"><label class="flabel">URL</label><input class="finput" id="clUrl" value="${c.url}"></div>
    <div class="frow">
      <div class="fgroup"><label class="flabel">Data</label><input class="finput" type="date" id="clData" value="${c.criado||''}"></div>
      <div class="fgroup"><label class="flabel">Estado</label>
        <select class="finput" id="clActivo">
          <option value="true" ${c.activo?'selected':''}>Activo</option>
          <option value="false" ${!c.activo?'selected':''}>Inactivo</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-red" onclick="updateClient(${i})">Guardar</button>
    </div>
  `);
}
function updateClient(i) {
  clientsList[i] = {
    id: document.getElementById('clId').value.trim().toUpperCase(),
    nome: document.getElementById('clNome').value.trim(),
    tipo: document.getElementById('clTipo').value,
    url: document.getElementById('clUrl').value.trim(),
    criado: document.getElementById('clData').value,
    activo: document.getElementById('clActivo').value === 'true'
  };
  closeModal(); renderClientes();
  toast('Actualizado — guarde no GitHub', 'info');
}
function deleteClient(i) {
  if (!confirm(`Remover "${clientsList[i].nome}" (ID: ${clientsList[i].id})?`)) return;
  clientsList.splice(i,1); renderClientes();
  toast('Removido — guarde no GitHub', 'info');
}
function copyId(id) {
  navigator.clipboard.writeText(id).then(() => toast(`ID ${id} copiado!`, 'success'));
}
function shareClient(i) {
  const c = clientsList[i];
  const baseUrl = `${location.origin}${location.pathname.replace('admin.html','verificar-site.html')}`;
  const link = `${baseUrl}?id=${c.id}`;
  openModal(`
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">Partilhar com <span class="r">${c.nome}</span></div>
    <p style="font-size:.85rem;color:var(--gray);margin-bottom:1.2rem">Partilhe o ID ou o link directo com o cliente:</p>
    <div class="fgroup">
      <label class="flabel">ID do Cliente</label>
      <div style="display:flex;gap:.5rem">
        <input class="finput" value="${c.id}" readonly style="font-family:monospace;letter-spacing:.12em;font-size:1.1rem">
        <button class="btn btn-red btn-sm" onclick="navigator.clipboard.writeText('${c.id}').then(()=>toast('ID copiado!','success'))">Copiar</button>
      </div>
    </div>
    <div class="fgroup">
      <label class="flabel">Link Directo para o Portal</label>
      <div style="display:flex;gap:.5rem">
        <input class="finput" value="${link}" readonly style="font-size:.75rem">
        <button class="btn btn-blue btn-sm" onclick="navigator.clipboard.writeText('${link}').then(()=>toast('Link copiado!','success'))">Copiar</button>
      </div>
    </div>
    <div style="background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25);border-radius:6px;padding:.8rem;font-size:.78rem;color:rgba(255,255,255,.6);margin-top:.5rem">
      O cliente acede a <strong style="color:var(--green)">verificar-site.html</strong>, insere o ID e vê automaticamente o link do seu site.
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Fechar</button>
      <a class="btn btn-blue" href="${link}" target="_blank">↗ Pré-visualizar</a>
    </div>
  `);
}
</script>
</body>
</html>
